

<form [formGroup]="formRS" class="row">

  <div class="p-3" formArrayName="redesSociais" *ngFor="let redeSocial of redesSociais.controls; let i=index">
    <fieldset [formGroupName]="i" class="form-group">

      <legend class="d-flex justify-content-between capitalize">
        {{retornaTitulo(redesSociais.at(i).get('nome')?.value)}}

        <button class="btn btn-sm btn-outline-warning mb-1" (click)="removerRedeSocial(template, i)"
                tooltip="Excluir Rede Social"
                [adaptivePosition]="false"
                [delay]="500"
                placement="left">
          <i class="fa fa-window-close"></i>
          <b class="">Excluir</b>
        </button>

      </legend>

      <div class="row">
        <div class="form-group col-md-4">
          <label>Nome</label>
          <select class="form-control" formControlName="nome" [ngClass]="funcaoGlobal.cssValidatorForm(redesSociais.at(i).get('nome'))">
            <option value="">Selecione</option>
            <option value="Youtube">Youtube</option>
            <option value="Instagram">Instagram</option>
            <option value="Facebook">Facebook</option>
            <option value="Twitter">Twitter</option>
            <option value="Google">Google</option>
            <option value="Linkedin">Linkedin</option>
            <option value="Pinterest">Pinterest</option>
            <option value="Whatsapp">Whatsapp</option>
            <option value="Telegram">Telegram</option>
            <option value="Skype">Skype</option>
            <option value="Vimeo">Vimeo</option>
          </select>
        </div>

        <div class="form-group col-md-8">
          <label>Link(URL)</label>
          <input type="text" class="form-control" formControlName="url" placeholder="URL">
        </div>

      </div>
    </fieldset>

  </div>
</form>

<button class="d-flex btn btn-outline-primary mt-4" (click)="adicionarRedeSocial()">
  <i class="fa fa-plus-circle my-1"></i>
  <b class="ml-1">Rede Social</b>
</button>

<br />
<div class="card-footer">
  <div class="d-flex">

    <div class="col-md-6">
      <button class="btn btn-outline-secondary mr-auto border">
        Cancelar Alteração
      </button>
    </div>

    <div class="col-md-6">
      <div class="float-end">
        <button class="btn btn-success" [disabled]="!formRS.controls['redesSociais'].valid" (click)="salvarRedeSociais()">
          Salvar Redes Sociais
        </button>
      </div>
    </div>

  </div>
</div>


<ng-template #template>
  <div class="modal-body text-center">
    <p>Tem certeza que quer deletar a Rede Social -  {{this.redeSocialAtual.nome}}  ?</p>
    <button type="button" class="btn btn-default" (click)="confirmDeleteRedeSocial()">Sim</button>
    <button type="button" class="btn btn-primary" (click)="decline()">Não</button>
  </div>
</ng-template>
