

<div class="card rounded shadow-sm p-3">


  <div class="row">
    <div class="col-md-3 mb-2">
      <label class="">Filtro:</label>
      <input type="text" class="form-control" placeholder="Buscar.." [(ngModel)]="FiltroLista" />
    </div>
    <div class="col-md-9 mt-3">
      <div class="float-end">
        <a class="btn btn-outline-primary" routerLink="/eventos/detalhe">
          <i class="fa fa-plus-circle my-2 me-2"></i>
          <b>Novo</b>
        </a>
      </div>
    </div>
  </div>


  <div class="row mb-3">

  </div>

  <!--<h3>Filtro: {{FiltroLista}}</h3>-->
  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>
          <button type="button" class="btn btn-outline-light btn-sm " (click)="AlternarImagem()">
            <i class="{{mostrarImagem ? 'fa fa-eye' : 'fa fa-eye-slash'}}"></i>
            {{mostrarImagem ? 'Exibir' : 'Ocultar'}}
          </button>
        </th>
        <th>#</th>
        <th>Tema</th>
        <th>Local</th>
        <th>Data</th>
        <th>Qtd Pessoas</th>
        <th>Lote</th>
        <th>Options</th>
      </tr>
    </thead>
    <tbody *ngIf="eventos && eventos.length">
      <tr *ngFor="let evento of eventosFiltrados">
        <td>
          <img [collapse]="mostrarImagem" [isAnimated]="true" src="assets/{{evento.imagemURL}}" alt=""
               [style.width.px]="widthImg" [style.height.px]="heightImg" />
        </td>
        <td>{{evento.id}}</td>
        <td>{{evento.tema}}</td>
        <td style="width:50px;">{{evento.local}}</td>
        <td>{{evento.dataEvento}}</td>
        <td>{{evento.qtdPessoas}}</td>
        <td>{{evento.lote}}</td>
        <td>
          <div class="row">
            <div class="col-md-5">
              <button type="button" class="btn btn-primary btn-sm text-nowrap" (click)="detalheEvento(evento.id)">
                <i class="fa fa-edit"></i>
                Editar
              </button>
            </div>
            <div class="col-md-6">
              <button type="button" class="btn btn-danger btn-sm text-nowrap" (click)="openModal(template, evento.id)">
                <i class="fa fa-trash"></i>
                Excluir
              </button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
    <tfoot *ngIf="!eventos.length">
      <tr>
        <td colspan="8" class="text-center">
          <h4>Nenhum Evento Encontrado.</h4>
        </td>
      </tr>
    </tfoot>
  </table>
</div>

<ng-template #template>
  <div class="modal-body text-center">
    <p>Tem certeza que quer deletar o Evento de código {{eventoId}} ?</p>
    <button type="button" class="btn btn-default" (click)="confirm()">Sim</button>
    <button type="button" class="btn btn-primary" (click)="decline()">Não</button>
  </div>
</ng-template>
