<div class="card rounded shadow-sm p-3">


  <div class="row">

    <div class="col-md-12 mb-2">
      <label class="">Filtro:</label>
      <input type="text" class="form-control" placeholder="Buscar.." #inputBuscar (input)="FiltrarPalestrantes(inputBuscar.value)" />
    </div>

  </div>

  <div *ngIf="palestrantes && palestrantes.length">
     <div class="row mt-2">
       <div class="col-md-4 mb-4 d-flex align-items-stretch" *ngFor="let palestrante of palestrantes ">

         <div class="card">
           <div class="d-flex align-self-center pt-3">
             <a>
               <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcRbezqZpEuwGSvitKy3wrwnth5kysKdRqBW54cAszm_wiutku3R"
                    name="aboutme" width="120" height="120" class="rounded-circle">
             </a>
           </div>
           <div class="card-body">
             <div class="h4 text-center mb-3">@ {{palestrante.user.userName}}</div>
             <div class="h7 text-bold pb-1"><b>Nome:</b> {{palestrante.user.primeiroNome + ' ' + palestrante.user.ultimoNome}}</div>
             <div class="h7">
               {{palestrante.miniCurriculo}}
             </div>
           </div>
           <ul class="list-group list-group-flush">
             <li class="list-group-item">
               <div class="row">
                 <div class="col-6 text-center border-right">
                   <div class="h5">0</div>
                   <div class="h6 text-muted">Meus eventos criados</div>
                 </div>
                 <div class="col-6 text-center">
                   <div class="h5">0</div>
                   <div class="h6 text-muted">Eventos como palestrante</div>
                 </div>
               </div>
             </li>
           </ul>
         </div>

       </div>
     </div>
  </div>
</div>
