<div class="row mt-4">

  <div class="col-md-6 d-none d-md-block" style="height: 450px;">
    <div class="text-center col-md-12 my-auto side-heder">
      <h1>Cadastro de Usuário</h1>
      <img src="../../../../assets/registerImage.png" class="my-4" alt="" width="400px">
    </div>
  </div>

  <div class="col-md-6">

    <form [formGroup]="form" class="p-1">
      <div class="pb-2 d-block d-md-none">
        <h3 class="border-bottom">Cadastro de Usuário</h3>
      </div>

      <div class="row">
        <div class="col-sm-6">
          <label>Primeiro Nome</label>
          <input type="text" class="form-control" formControlName="primeiroNome" placeholder="Insira o Primeiro nome"
                 [ngClass]="funcaoGlobal.cssValidatorForm(primeiroNome)" />
          <div class="invalid-feedback" *ngIf="primeiroNome?.hasError('required')">
            Primeiro Nome é obrigatório.
          </div>
        </div>

        <div class="col-sm-6">
          <label>Último nome</label>
          <input type="text" class="form-control" formControlName="ultimoNome" placeholder="Insira o Último nome"
                 [ngClass]="funcaoGlobal.cssValidatorForm(ultimoNome)" />
          <div class="invalid-feedback" *ngIf="ultimoNome?.hasError('required')">
            Ultimo Nome é obrigatório.
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-6">
          <label for="">Email:</label>
          <input class="form-control" type="text" formControlName="email" placeholder="Insira o Email"
                 [ngClass]="funcaoGlobal.cssValidatorForm(email)" />
          <div class="invalid-feedback" *ngIf="email?.hasError('required')">
            Email é obrigatório.
          </div>
          <div class="invalid-feedback" *ngIf="email?.hasError('email')">
            Email é inválido.
          </div>
        </div>

        <div class="col-sm-6">
          <label for="">Usuario:</label>
          <input class="form-control" type="text" formControlName="usuario" placeholder="Insira o nome de Usuário"
                 [ngClass]="funcaoGlobal.cssValidatorForm(usuario)" />
          <div class="invalid-feedback" *ngIf="usuario?.hasError('required')">
            Usuario é obrigatório.
          </div>
        </div>
      </div>

      <div class="row">
        <div class="form-group col-sm-6">
          <label for="">Senha:</label>
          <input class="form-control" type="password" formControlName="senha" placeholder="Digite uma Senha"
                 [ngClass]="funcaoGlobal.cssValidatorForm(senha)" />
          <div class="invalid-feedback" *ngIf="senha?.hasError('required')">
            Senha é obrigatório.
          </div>
          <div class="invalid-feedback" *ngIf="senha?.hasError('minlength')">
            Senha deveter no mínimo 6 caracteres.
          </div>
        </div>

        <div class="form-group col-sm-6">
          <label for="">Confirmar Senha:</label>
          <input class="form-control" type="password" formControlName="confirmarSenha" placeholder="Confirme a Senha"
                 [ngClass]="funcaoGlobal.cssValidatorForm(confirmarSenha)" />
          <div class="invalid-feedback" *ngIf="confirmarSenha?.hasError('required')">
            Confirmar Senha é obrigatório.
          </div>
          <div class="invalid-feedback" *ngIf="confirmarSenha?.hasError('mustMatch')">
            Senha não confere.
          </div>
        </div>
      </div>

      <div class="form-row p-1 mb-3">
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="customCheck1">
          <label class="custom-control-label">Eu concordo com os <a href="#">Termos de Uso</a>.</label>
        </div>
      </div>

      <div class="row">
        <div class="form-group col-12">
          <button class="btn btn-lg btn-success btn-block px-5" [disabled]="!form.valid">
            Registar
          </button>
        </div>
      </div>
      <div class="row">
        <div class="form-group col-12">
          <a class="btn btn-link btn-block" routerLink="/user/login">
            Já sou Cadastrado
          </a>
        </div>
      </div>
    </form>

  </div>
</div>
