<nav class="navbar navbar-expand-lg bg-body-tertiary bg-white shadow-sm" *ngIf="mostrarMenu()">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="home">
      <i class="fa fa-users" style="font-size:35px"></i>
    </a>
    <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [collapse]="isCollapsed" [isAnimated]="true" id="navbarNav">

      <ng-container *ngIf="(accountService.currentUser$ | async) !== null">
        <ul class="navbar-nav">
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" aria-current="page" routerLink="dashboard">Dashboard</a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" aria-current="page" routerLink="eventos">Eventos</a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="palestrantes">Palestrantes</a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="contatos">Contatos</a>
          </li>
        </ul>
      </ng-container>

      <div class="d-block ms-auto">

        <div *ngIf="(accountService.currentUser$ | async) === null" class="navbar-nav d-xs-none d-none d-md-block">
          <a class="btn btn-light me-3 border" routerLink="/user/login">Entrar</a>
          <a class="btn btn-warning" routerLink="user/cadastro">Me Cadastrar</a>
        </div>

        <div *ngIf="(accountService.currentUser$ | async) !== null" class="btn-group" dropdown>
          <button *ngIf="(accountService.currentUser$ | async) as user" id="button-basic" dropdownToggle type="button" class="btn btn-primary btn-sm dropdown-toggle" aria-controls="dropdown-basic">
            {{user.primeiroNome}} <span class="caret"></span>
          </button>
          <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-basic">
            <li role="menuitem">
              <a class="dropdown-item" routerLink="/user/perfil">Perfil</a>
            </li>
            <li role="menuitem">
              <a class="dropdown-item" routerLink="" (click)="logout()">Sair</a>
            </li>
          </ul>
        </div>

      </div>

    </div>

  </div>
</nav>
